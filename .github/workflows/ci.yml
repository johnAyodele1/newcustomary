name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/customry
      CLIENT_ORIGIN: http://localhost:5173
      PAYSTACK_EMAIL: payments@customry.local
      PAYSTACK_SECRET_KEY: sk_test_ci_placeholder
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: customry
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d customry"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
